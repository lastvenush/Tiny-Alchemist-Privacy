<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tiny Alchemist için teknik destek, geri bildirim ve iletişim. Geliştirici: Lunocta Labs.">
  <title>Tiny Alchemist Destek</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; color: #253042; font: 1rem/1.75 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 800px; margin: 32px auto; padding: 40px; background: #fff; border: 1px solid #e0e4eb; border-radius: 12px; overflow-wrap: anywhere; }
    h1 { color: #182235; font-size: clamp(1.65rem, 5vw, 2.25rem); line-height: 1.25; margin: 12px 0 20px; }
    h2 { color: #182235; margin: 32px 0 8px; font-size: 1.2rem; line-height: 1.4; }
    p { margin: 0 0 16px; }
    .brand, .meta { color: #536174; }
    .brand { font-weight: 650; letter-spacing: .03em; }
    a { color: #254d9b; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid #254d9b; outline-offset: 4px; }
    footer { border-top: 1px solid #e0e4eb; margin-top: 32px; padding-top: 20px; color: #536174; }
    @media (max-width: 600px) { main { margin: 0; padding: 28px 20px 40px; border: 0; border-radius: 0; } }
    @media print { body { background: #fff; } main { border: 0; margin: 0; padding: 0; max-width: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">Lunocta Labs</p>
      <h1>Tiny Alchemist Destek</h1>
      <p class="meta"><strong>Geliştirici:</strong> Lunocta Labs</p>
    </header>
    <p>Tiny Alchemist ile ilgili teknik sorunlar, geri bildirimler veya destek talepleri için bizimle iletişime geçebilirsiniz.</p>
    <section aria-labelledby="contact">
      <h2 id="contact">Destek e-postası</h2>
      <p><a href="mailto:lunoctalabs@gmail.com">lunoctalabs@gmail.com</a></p>
    </section>
    <footer>
      <a href="https://lastvenush.github.io/Tiny-Alchemist-Privacy/">Gizlilik politikasına dön</a>
    </footer>
  </main>
</body>
</html>
